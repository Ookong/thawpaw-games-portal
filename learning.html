<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 编程学习 · ThawPaw Games HQ</title>
<link rel="icon" href="assets/favicon.ico">
<script>var BUILD_TIME="DEV"</script>
<style>
:root{--bg:#0f1420;--card:#171e2e;--card2:#1e2740;--border:#2a3550;--text:#e8ecf4;--text2:#8b96ad;--accent:#5b9dff;--accent2:#7c6cff;--ok:#3ecf8e;--warn:#ffb454}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:1.6rem}
.sub{color:var(--text2);font-size:.9rem}
.notice{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin:16px 0;font-size:.9rem;color:var(--text2);line-height:1.7}
.notice b{color:var(--text)}
.layout{display:grid;grid-template-columns:260px 1fr;gap:20px;margin-top:16px}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.weeks{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;align-self:start}
.weeks h3{font-size:.95rem;margin-bottom:10px;color:var(--text2)}
.wk{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:6px;border:1px solid transparent;transition:all .15s}
.wk:hover{background:var(--card2)}
.wk.active{background:var(--card2);border-color:var(--accent)}
.wk .id{font-weight:700;font-size:.9rem;min-width:40px}
.wk .t{font-size:.85rem;color:var(--text2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.wk.done .dot{background:var(--ok)}
.wk.current .dot{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.content{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px}
.wk-title{font-size:1.25rem;margin-bottom:4px}
.wk-meta{color:var(--text2);font-size:.82rem;margin-bottom:18px}
.lesson{border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:14px;background:var(--card2)}
.lesson-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.lesson-head input[type=checkbox]{width:18px;height:18px;accent-color:var(--ok);cursor:pointer;flex-shrink:0}
.lesson-head .lt{font-weight:700;font-size:1rem;flex:1}
.lesson.done{border-color:rgba(62,207,142,.35)}
.md{font-size:.92rem;line-height:1.8;color:var(--text);overflow-wrap:break-word}
.md h1,.md h2,.md h3{margin:14px 0 8px;font-size:1.05rem}
.md p{margin:8px 0}
.md code{background:rgba(91,157,255,.12);border-radius:5px;padding:2px 6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85em;color:#a8c8ff}
.md pre{background:#0b0f18;border:1px solid var(--border);border-radius:10px;padding:12px 14px;overflow-x:auto;margin:10px 0}
.md pre code{background:none;padding:0;color:#c9d7f0}
.md ul,.md ol{margin:8px 0 8px 22px}
.md blockquote{border-left:3px solid var(--accent);padding:4px 12px;color:var(--text2);margin:10px 0}
.md a{color:var(--accent)}
.md table{border-collapse:collapse;margin:10px 0;font-size:.85rem}
.md td,.md th{border:1px solid var(--border);padding:6px 10px}
.hw{margin-top:20px;border-top:1px dashed var(--border);padding-top:16px;font-size:.85rem;color:var(--text2);line-height:1.8}
.hw code{background:rgba(124,108,255,.12);border-radius:5px;padding:1px 6px;font-family:ui-monospace,Menlo,monospace;color:#c0b4ff}
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty .big{font-size:3rem;margin-bottom:12px}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:r 0.8s linear infinite;margin:40px auto}
@keyframes r{to{transform:rotate(360deg)}}
.err{color:#ff8095}
footer{text-align:center;color:var(--text2);font-size:.75rem;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📚 编程学习</h1>
    <span class="sub">ThawPaw Games HQ · 家庭 12 周双轨课程（苗苗 🐱 游戏创作轨 / Tree 🌳 数据分析轨）</span>
  </header>
  <div class="notice">
    <b>怎么用：</b>每周左边选周 → 逐课阅读 → 学完勾选（进度自动保存在本机）→ 作业写到电脑上的 <b>~/learning-homework/</b> 目录，检查人会批改并回复 <b>.review.md</b>。
    每周日晚如意发布下周内容。卡住随时喊 IcePaw / 如意 ❄️✨
  </div>
  <div class="layout">
    <aside class="weeks"><h3>🗓 课程周</h3><div id="weeks"><div class="spin"></div></div></aside>
    <main class="content" id="content"><div class="spin"></div></main>
  </div>
  <footer>ThawPaw Games HQ · learning v1 · <span id="bt"></span></footer>
</div>
<script src="vendor/marked.min.js"></script>
<script>
const API='https://tpg-hq.thawflow.com';
const $=s=>document.querySelector(s);
const PROG_KEY='learning-progress';
let prog={};try{prog=JSON.parse(localStorage.getItem(PROG_KEY)||'{}')}catch(e){}
let weeksData=[],curWeek=null;

async function loadIndex(){
  try{
    const r=await fetch(API+'/learning/weeks',{headers:{'User-Agent':'curl/8.7.1'}});
    const j=await r.json();
    weeksData=(j.index&&j.index.weeks)||[];
  }catch(e){weeksData=[]}
  renderWeeks();
  if(!weeksData.length){
    $('#content').innerHTML='<div class="empty"><div class="big">🌱</div><b>第一周课程还在路上</b><br><br>如意正在上传 W01 内容（今晚就绪）。<br>先去把 VS Code 打开热热身——你的第一个程序 clan.py 还等着跑第 6 次呢 🐾</div>';
    return;
  }
  const cur=weeksData.find(w=>w.current)||weeksData[weeksData.length-1];
  if(cur)loadWeek(cur.id);
}
function renderWeeks(){
  const box=$('#weeks');box.innerHTML='';
  const sorted=[...weeksData].sort((a,b)=>(a.id<b.id?-1:1));
  for(const w of sorted){
    const done=weekDone(w.id);
    const el=document.createElement('div');
    el.className='wk'+(w.current?' current':'')+(done?' done':'')+(curWeek===w.id?' active':'');
    el.innerHTML='<span class="id">'+w.id+'</span><span class="t">'+(w.title||'')+'</span><span class="dot"></span>';
    el.onclick=()=>loadWeek(w.id);
    box.appendChild(el);
  }
}
function weekDone(id){
  const w=localStorage.getItem('learning-week-'+id);
  return w==='1';
}
async function loadWeek(id){
  curWeek=id;
  $('#content').innerHTML='<div class="spin"></div>';
  renderWeeks();
  try{
    const r=await fetch(API+'/learning/week/'+id,{headers:{'User-Agent':'curl/8.7.1'}});
    if(!r.ok){throw new Error('HTTP '+r.status)}
    const j=await r.json();
    renderWeek(j.week);
  }catch(e){
    $('#content').innerHTML='<div class="empty"><div class="big">📡</div>拉取 '+id+' 失败：'+e.message+'<br><br><button onclick="loadWeek(\''+id+'\')" style="margin-top:12px;padding:8px 20px;border-radius:10px;border:1px solid var(--accent);background:var(--card2);color:var(--accent);cursor:pointer">重试</button></div>';
  }
}
function renderWeek(w){
  const lessons=w.lessons||[];
  let allDone=true;
  let html='<div class="wk-title">'+(w.title||w.week_id)+'</div><div class="wk-meta">发布：'+(w.published_at?w.published_at.slice(0,10):'—')+' · '+lessons.length+' 课</div>';
  for(const L of lessons){
    const key=w.week_id+':'+L.id;
    const checked=!!prog[key];
    if(!checked)allDone=false;
    html+='<div class="lesson'+(checked?' done':'')+'">'
      +'<div class="lesson-head"><input type="checkbox" data-k="'+key+'"'+(checked?' checked':'')+'><span class="lt">'+(L.title||L.id)+'</span></div>'
      +'<div class="md">'+(window.marked?marked.parse(L.markdown||'内容待补'):（L.markdown||'内容待补'))+'</div></div>';
  }
  html+='<div class="hw">🐾 <b>本周作业</b>：在你的电脑 <code>~/learning-homework/</code> 下建 <code>'+w.week_id+'/</code> 目录，作业命名 <code>'+w.week_id+'-d1.py</code>（周-天）。做完 commit，检查人批改后会出现 <code>*.review.md</code>。<br>· 苗苗 → IcePaw 检查 · Tree → 如意检查</div>';
  $('#content').innerHTML=html;
  $('#content').querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.onchange=()=>{
      prog[cb.dataset.k]=cb.checked;
      localStorage.setItem(PROG_KEY,JSON.stringify(prog));
      localStorage.setItem('learning-week-'+w.week_id,lessons.every(L=>prog[w.week_id+':'+L.id])?'1':'0');
      cb.closest('.lesson').classList.toggle('done',cb.checked);
      renderWeeks();
    };
  });
}
loadIndex();
$('#bt').textContent=BUILD_TIME==='DEV'?'DEV build':'v'+BUILD_TIME;
</script>
</body>
</html>
